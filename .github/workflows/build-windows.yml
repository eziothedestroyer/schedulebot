name: Build Windows EXE
on:
  workflow_dispatch:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
    branches: [main]
permissions:
  contents: read
jobs:
  test:
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest]
        python-version: ["3.10", "3.13"]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - run: python -m pip install -r requirements.txt
      - run: python -m unittest discover -s tests -v
      - run: python -m compileall -q .
  build:
    needs: test
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - run: python -m pip install pyinstaller -r requirements.txt
      - run: pyinstaller --clean --noconfirm ScheduleBot.spec
      - shell: pwsh
        run: |
          $hash = (Get-FileHash dist/ScheduleBot.exe -Algorithm SHA256).Hash.ToLower()
          "$hash  ScheduleBot.exe" | Set-Content dist/ScheduleBot.exe.sha256
      - uses: actions/upload-artifact@v4
        with:
          name: ScheduleBot-Windows
          if-no-files-found: error
          path: |
            dist/ScheduleBot.exe
            dist/ScheduleBot.exe.sha256
